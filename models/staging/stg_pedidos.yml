version: 2

models:
  - name: stg_pedidos
    columns:
      - name: pedido_id
        tests:
          - unique
          - not_null
      - name: cliente_id
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['aprovado', 'cancelado']
      - name: valor
        tests:
          - not_null