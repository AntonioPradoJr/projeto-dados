version: 2

models:
  - name: stg_pedidos
    description: "Dados de pedidos limpos e padronizados a partir da tabela bruta raw.pedidos"
    columns:
      - name: pedido_id
        description: "Identificador único do pedido"
        tests:
          - unique
          - not_null
      - name: cliente_id
        description: "Identificador do cliente que realizou o pedido"
        tests:
          - not_null
      - name: status
        description: "Status do pedido — aprovado ou cancelado"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['aprovado', 'cancelado']
      - name: valor
        description: "Valor monetário do pedido em reais"
        tests:
          - not_null
      - name: data_pedido
        description: "Data em que o pedido foi realizado"